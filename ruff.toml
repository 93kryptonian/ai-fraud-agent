# Lint policy for local runs and CI (see .github/workflows/ci.yml).
#
# The rule set is selected explicitly, and CI pins the ruff version, so linting
# is deterministic. Without this, "ruff check" enforced whatever the installed
# version enables by default: newer ruff releases enable many more rules
# (pyupgrade, blind-except, import sorting, ...), which turned CI red with no
# change to the code. These are the long-standing defaults:
#   E4 / E7 / E9  pycodestyle imports, statements, syntax errors
#   F             pyflakes (unused imports/variables, undefined names, ...)
#
# Deliberately NOT enabled: BLE001 (blind except). Several components catch
# Exception on purpose so that telemetry or a limiter bug fails open instead of
# taking the API down; "fixing" those would change behaviour.

[lint]
select = ["E4", "E7", "E9", "F"]
