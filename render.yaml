services:
  - type: web
    name: ai-fraud-agent
    runtime: docker
    plan: free

    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false

      # Render terminates TLS in front of the app: use X-Forwarded-For for
      # per-client rate limiting (1 trusted proxy hop).
      - key: TRUST_FORWARDED_FOR
        value: "true"

      # Optional defaults
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: EMBEDDINGS_ENABLED
        value: "true"
      # Must match the vector(N) column in infra/supabase_schema.sql
      - key: EMBEDDING_DIM
        value: "1536"
      - key: RETRIEVER_ENABLED
        value: "true"

  # Live demo UI: a thin client of the API above. It needs only API_URL and
  # holds no provider or database credentials.
  - type: web
    name: ai-fraud-agent-ui
    runtime: python
    plan: free
    rootDir: live_ui
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_URL
        value: https://ai-fraud-agent.onrender.com
