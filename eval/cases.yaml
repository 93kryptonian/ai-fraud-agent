# ---- compound: KNOWN LIMITATION, not scored --------------------------------
# One question that needs two jobs (rank with SQL, then explain from documents).
# The system picks ONE path, so it can only do the first job. This case records
# what happens; it does not claim a hybrid workflow exists.
- id: C1
  text: "Which merchant categories have the highest fraud rates, and what might explain the pattern?"
  language: en
  category: compound
  decision: heuristic
  expected_route: analytics
  expected_behavior: answer
  expect_sql: true
  scored: false
  note: "single path by design: the explanation half is not attempted"
