# Evaluation cases. One entry per question, with what the system SHOULD do.
#
#   category   analytics | rag | reject | ambiguous | compound
#   decision   which layer is expected to decide the route:
#                heuristic  keyword rules in the orchestrator (checkable offline)
#                guardrail  the input guardrails reject it (checkable offline)
#                llm        needs the LLM classifier (live run only)
#   language   language of the question, and of the expected answer
#   scored     false = reported but not counted in pass/fail (known limitation)
#
# Expectations describe the intended behavior. A failing live case is a finding
# to report, not a reason to edit the case.

# ---- analytics: data questions answered with SQL ---------------------------
- id: A1
  text: "How does the monthly fraud rate change over time?"
  language: en
  category: analytics
  decision: heuristic
  expected_route: analytics
  expected_behavior: answer
  must_include: [fraud]
  expect_sql: true

